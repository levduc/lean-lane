[workspace]
resolver = "2"
members = ["crates/lean-native", "crates/lean-core", "crates/lean-lane-node", "crates/lean-bench", "crates/lean-oracle", "crates/lean-diff", "crates/spammer"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
alloy-rpc-types-txpool = { version = "~2.0.5", default-features = false }
alloy-signer = { version = "~2.0.5", default-features = false }
alloy-signer-local = { version = "~2.0.5", default-features = false, features = ["mnemonic"] }
alloy-sol-types = { version = "1.6.0", default-features = false }
chrono = "0.4.44"
clap = "4"
clap-verbosity-flag = { version = "3.0.4", features = ["tracing"] }
color-eyre = "0.6"
futures-util = { version = "0.3", default-features = false }
hex = { version = "0.4.3", features = ["serde"] }
k256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
rand = { version = "0.8.5", features = ["std_rng", "small_rng"] }
strum = { version = "0.27", default-features = false }
strum_macros = "0.27"
tracing = { version = "0.1.0", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi"] }
url = { version = "2.3", default-features = false }
# Pinned to the same upstream reth tag the lane was measured against (v2.3.0).
alloy-consensus = { version = "~2.0.5", default-features = false }
alloy-eips = { version = "~2.0.5", default-features = false }
alloy-primitives = { version = "1.6.0", default-features = false, features = ["map-foldhash", "keccak-cache-global", "asm-keccak"] }
alloy-rlp = { version = "0.3.15", default-features = false, features = ["core-net"] }
eyre = "0.6"
jsonrpsee = "0.26.0"
rayon = "1.10"
reth-chainspec = { git = "https://github.com/paradigmxyz/reth", tag = "v2.3.0", default-features = false }
reth-db-models = { git = "https://github.com/paradigmxyz/reth", tag = "v2.3.0", default-features = false }
reth-ethereum-primitives = { git = "https://github.com/paradigmxyz/reth", tag = "v2.3.0", default-features = false }
reth-evm-ethereum = { git = "https://github.com/paradigmxyz/reth", tag = "v2.3.0", default-features = false }
reth-execution-types = { git = "https://github.com/paradigmxyz/reth", tag = "v2.3.0", default-features = false }
reth-primitives-traits = { version = "0.4.1", default-features = false }
reth-storage-api = { git = "https://github.com/paradigmxyz/reth", tag = "v2.3.0", default-features = false }
reth-storage-errors = { git = "https://github.com/paradigmxyz/reth", tag = "v2.3.0", default-features = false }
reth-transaction-pool = { git = "https://github.com/paradigmxyz/reth", tag = "v2.3.0" }
reth-trie-common = { git = "https://github.com/paradigmxyz/reth", tag = "v2.3.0", default-features = false }
revm-database = { version = "15.0.2", default-features = false }
secp256k1 = { version = "0.30", default-features = false, features = ["global-context", "recovery"] }
serde = { version = "1.0", default-features = false }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
tokio = { version = "1.44.2", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 16

# Debug-build speed for the crypto the test suites hammer (lean-diff runs
# thousands of signatures/recoveries per `cargo test`); no effect on release.
[profile.dev.package.k256]
opt-level = 3
[profile.dev.package.elliptic-curve]
opt-level = 3
[profile.dev.package.crypto-bigint]
opt-level = 3
[profile.dev.package.secp256k1-sys]
opt-level = 3
[profile.dev.package.sha3]
opt-level = 3
[profile.dev.package.keccak]
opt-level = 3
