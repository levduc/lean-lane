[package]
name = "lean-lane-node"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Standalone lean payment-lane node: reth as a mempool library + flat-state fan-out executor + append-only log. No MPT, no receipts root, no Ethereum header — the CL is the source of truth (increment 2b')."
publish = false

[dependencies]
lean-native = { path = "../lean-native" }
alloy-primitives.workspace = true
alloy-consensus.workspace = true
alloy-eips.workspace = true
reth-transaction-pool.workspace = true
reth-execution-types.workspace = true
reth-evm-ethereum.workspace = true
reth-primitives-traits.workspace = true
reth-storage-api.workspace = true
reth-ethereum-primitives.workspace = true
reth-db-models.workspace = true
reth-storage-errors.workspace = true
reth-chainspec.workspace = true
reth-trie-common.workspace = true
revm-database.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
jsonrpsee = { workspace = true, features = ["server", "http-client", "macros"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
base64 = "0.22"
eyre.workspace = true
secp256k1 = { workspace = true, features = ["std", "recovery", "global-context", "rand"] }
rayon.workspace = true

[dev-dependencies]
tempfile = "3"
