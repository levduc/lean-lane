[package]
name = "lean-native"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Lean fan-out native transfer type (0x50) for the Arc payment lane: fixed-width codec, 1 signature -> N recipients, EIP-2718 envelope and signing (the reth pool integration lives in lean-lane-node)"
publish = false

[dependencies]
alloy-primitives.workspace = true
alloy-consensus = { workspace = true, features = ["serde", "k256"] }
alloy-eips.workspace = true
alloy-rlp.workspace = true
serde.workspace = true
secp256k1 = { workspace = true, features = ["std", "recovery", "global-context"] }

[dev-dependencies]
serde_json.workspace = true
