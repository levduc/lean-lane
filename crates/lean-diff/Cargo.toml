[package]
name = "lean-diff"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Correctness safety net for the lean-core engine: differential testing against lean-oracle (seeded adversarial chains + delta-debugging), snapshot/restart equivalence, mutational decode fuzzing, SPEC.md golden vectors. The `lean-diff` binary is what scripts/engine-gate.sh drives."

[[bin]]
name = "lean-diff"
path = "src/main.rs"

[dependencies]
lean-core = { path = "../lean-core" }
lean-native = { path = "../lean-native" }
lean-oracle = { path = "../lean-oracle" }
lean-lane-node = { path = "../lean-lane-node" }
alloy-primitives.workspace = true
secp256k1 = { workspace = true, features = ["std", "recovery", "global-context"] }
k256 = { workspace = true, features = ["arithmetic"] }
clap = { workspace = true, features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["std"] }
tempfile = "3"
hex.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync"] }
