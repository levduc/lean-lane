[package]
name = "lean-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Pure, synchronous, I/O-free block-processing engine of the lean payment lane: framing -> tx decode -> sender recovery -> total STF. No tokio, no reth, no filesystem."
publish = false

[dependencies]
lean-native = { path = "../lean-native" }
alloy-primitives.workspace = true
rayon.workspace = true

[dev-dependencies]
alloy-consensus.workspace = true
alloy-eips.workspace = true
secp256k1 = { workspace = true, features = ["std", "recovery", "global-context"] }
